# 메이플 AI 화면 컨테이너. 호스트 Nginx 가 HTTPS 를 종료하고 /maple-ai/ 를 이 컨테이너로 전달한다.
# /maple-ai/api/ 는 호스트 Nginx 가 Tailscale 로 개인 PC 에 직접 프록시하므로 여기로 오지 않는다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 캐릭터 이미지는 Nexon Open API 정적 서버에서 직접 불러온다.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://open.api.nexon.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control $maple_cache always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location = /maple-ai { return 301 /maple-ai/; }
    location /maple-ai/assets/ { try_files $uri =404; }
    location ~* ^/maple-ai/.+\.(?:js|css|svg|png|jpg|jpeg|webp|ico|txt)$ { try_files $uri =404; }
    location /maple-ai/ { try_files $uri /maple-ai/index.html; }
    location / { return 404; }
}

map $uri $maple_cache {
    default "no-cache";
    ~^/maple-ai/assets/ "public, max-age=31536000, immutable";
    ~*\.(?:svg|png|jpg|jpeg|webp|ico)$ "public, max-age=86400";
}
