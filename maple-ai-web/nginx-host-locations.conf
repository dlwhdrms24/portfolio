# 기존 3geun.com HTTPS server block 안에 추가할 location 예시.
# /maple-ai/api/ 는 이미 snippets/maple-ai-locations.conf 로 개인 PC 에 연결되어 있다 (maple-ai 저장소 deploy/ 참고).
# 더 긴 접두사(/maple-ai/api/)가 우선하므로 아래 화면 경로와 충돌하지 않는다.

location = /maple-ai {
    return 308 /maple-ai/$is_args$args;
}

location ^~ /maple-ai/ {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:18100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
