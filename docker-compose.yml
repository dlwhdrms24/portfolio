name: developer-portfolio
services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-developer-portfolio:local}
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORTFOLIO_PORT:-18080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
