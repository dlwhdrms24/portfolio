server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # 하위 location에 add_header를 두지 않아 보안 헤더 상속을 유지한다.
    add_header Cache-Control $portfolio_cache always;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|pdf|xml|txt)$ { try_files $uri =404; }
    location / { try_files $uri/index.html $uri $uri/ /index.html; }
    # 알 수 없는 프로젝트는 HTTP 404와 동일한 앱 404 화면을 반환한다.
    location /projects/ { try_files $uri/index.html $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}

map $uri $portfolio_cache {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(?:png|jpg|jpeg|webp|avif|svg|ico|woff2?)$ "public, max-age=86400";
}
